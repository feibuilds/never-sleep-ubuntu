[package]
name = "never-sleep-ubuntu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keep an Ubuntu laptop awake with the display off"
default-run = "never-sleep"
authors = ["Phil Liu <phil@pnrcreations.com>"]
repository = "https://github.com/pandadolphin/never-sleep-ubuntu"
homepage = "https://github.com/pandadolphin/never-sleep-ubuntu"
readme = "README.md"
rust-version = "1.88"
keywords = ["ubuntu", "linux", "sleep", "dpms", "systemd"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = ["docs/**", ".github/**"]

[workspace]

[[bin]]
name = "never-sleep"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
dead_code = "warn"
unused = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
