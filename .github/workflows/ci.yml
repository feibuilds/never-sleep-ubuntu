name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]

    steps:
      - uses: actions/checkout@v7

      - name: Install desktop validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils shellcheck

      - name: Select pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Validate scripts and desktop entry
        run: |
          python3 -m py_compile scripts/tray.py
          shellcheck scripts/*.sh
          desktop-file-validate packaging/never-sleep.desktop

      - name: Validate source package
        run: cargo package --locked
